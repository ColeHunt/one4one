services:
  one4one:
    build: .
    container_name: one4one
    restart: unless-stopped
    environment:
      ROOM_TTL_HOURS: "48"
    volumes:
      - one4one-data:/data

# Shared edge network, created and owned by the /opt/proxy stack.
networks:
  default:
    name: web
    external: true

volumes:
  one4one-data:
